version: '3.8'
services:
  db:
    image: postgres:14
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./server/db/data:/var/lib/postgresql/data
      - ./server/db/init:/docker-entrypoint-initdb.d

  adminer:
    image: adminer
    depends_on:
      - db
    ports:
      - 9090:8080

  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    depends_on:
      - db
      - adminer
    environment:
      DATABASE_HOST: db
      DATABASE_USER: postgres
      DATABASE_PASSWORD: pass
      DATABASE_NAME: postgres
    ports:
      - "8080:8080"
    restart: unless-stopped

  client:
    build:
      context: .
      dockerfile: Dockerfile.client
    depends_on:
      - server
    environment:
      GYMGYM_HOST: server
      GYMGYM_PORT: 8080
    tty: true
    stdin_open: true